    <title>ShalaSarathi — શિક્ષક કમ્યુનિટી અને શાળા કાર્ય સહાયક</title>
    <script>
      (function() {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore error if restricted
        }
      })();
    </script>
